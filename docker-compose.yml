version: '3.9'

# Required: create a .env file in this directory with:
#   POSTGRES_PASSWORD=<strong-random-password>

services:
  postgres:
    image: postgres:15-alpine
    container_name: dokcrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dokcrm
      POSTGRES_USER: dokcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dokcrm -d dokcrm']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dokcrm_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: dokcrm_frontend
    restart: on-failure

volumes:
  postgres_data:
    name: dokcrm_postgres_data
