# ── DOK CRM root domain - FIRST (most specific) ──────────────────────────────
server {
    listen 80;
    server_name crmstack.site;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://crmstack.site$request_uri; }
}

server {
    listen 443 ssl;
    server_name crmstack.site;
    ssl_certificate     /etc/letsencrypt/live/crmstack.site-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmstack.site-0001/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    root /usr/share/nginx/html/crm;
    index index.html;
    location ~ /\.env { deny all; return 404; }
    location /api/ {
        proxy_pass         http://dokcrm_backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}

# ── DOK CRM subdomains (tenant routing) ──────────────────────────────────────
server {
    listen 80;
    server_name ~^(?<subdomain>[^.]+)\.crmstack\.site$;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ~^(?<subdomain>[^.]+)\.crmstack\.site$;
    ssl_certificate     /etc/letsencrypt/live/crmstack.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmstack.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    root /usr/share/nginx/html/crm;
    index index.html;
    location ~ /\.env { deny all; return 404; }
    location /api/ {
        proxy_pass         http://dokcrm_backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  https;
        proxy_set_header   X-Tenant-Subdomain $subdomain;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}

# ── DOK-HR ────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name dokhroperations.site www.dokhroperations.site;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name dokhroperations.site www.dokhroperations.site;
    ssl_certificate     /etc/letsencrypt/live/dokhroperations.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dokhroperations.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    location / {
        proxy_pass         http://dok-hr-client:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   X-Forwarded-Proto https;
    }
}

