services:

  postgres:
    image: postgres:15-alpine
    container_name: dokcrm_postgres
    expose:
      - "5432"
    environment:
      POSTGRES_DB: dokcrm
      POSTGRES_USER: dokcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokcrm-net
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dokcrm -d dokcrm']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./CRMStack/backend
      dockerfile: Dockerfile
    container_name: dokcrm_backend
    expose:
      - "4000"
    env_file:
      - ./CRMStack/backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
    networks:
      - dokcrm-net
      - shared-nginx
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./CRMStack/frontend
      dockerfile: Dockerfile
    container_name: dokcrm_frontend
    volumes:
      - frontend_dist:/output
    networks:
      - dokcrm-net
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - frontend_dist:/usr/share/nginx/html/crm:ro 
    networks:
      - dokcrm-net
      - shared-nginx
    depends_on:
      - backend
    restart: always

  certbot:
    image: certbot/certbot
    container_name: dok-crm-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $!; done"]
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    expose:
      - "3001"
    volumes:
      - uptime_data:/app/data
    networks:
      - shared-nginx
    restart: always

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    pid: host
    network_mode: host
    cap_add: [SYS_PTRACE, SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    expose:
      - "5050"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_LISTEN_PORT=5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - dokcrm-net
      - shared-nginx
      - dokhr-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    expose:
      - "8888"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - shared-nginx
    restart: always

networks:
  dokcrm-net:
    name: dokcrm-net
  shared-nginx:
    name: shared-nginx
    external: false
  dokhr-net:
    name: dokhr-net
    external: true

volumes:
  postgres_data:
    name: dokcrm_postgres_data
  frontend_dist:
  certbot_certs:
  uptime_data:
  netdata_config:
  netdata_lib:
  netdata_cache:
  pgadmin_data:
