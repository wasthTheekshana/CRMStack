# FMI dedicated stack - fmi.crmstack.site
# Run from: ~/crm-fmi-stack/deploy/fmi   (docker compose --env-file .env ...)
services:
  dbfmi:
    image: postgres:15-alpine
    container_name: crm-fmi-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: dokfmi
      POSTGRES_USER: dokfmi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    command: >
      postgres -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c work_mem=16MB
               -c max_connections=100
    volumes:
      - /mnt/disks/data/db/crm-fmi:/var/lib/postgresql/data
    networks:
      - fmi-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
          pids: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokfmi -d dokfmi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: crm-fmi-backend
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ../../backend/.env
    environment:
      DB_HOST: dbfmi
      DB_PORT: 5432
      NODE_ENV: production
    networks:
      - fmi-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
          pids: 200
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      dbfmi:
        condition: service_healthy

  # Static SPA + /api proxy to backend. Shared Nginx proxies fmi.crmstack.site here.
  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: ""
    container_name: crm-fmi-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - fmi-net
      - shared-nginx
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

networks:
  fmi-net:
    name: crm-fmi-net
  shared-nginx:
    name: shared-nginx
    external: true
