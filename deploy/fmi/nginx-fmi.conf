# Add to ~/dok-stack/nginx/nginx.conf ABOVE the wildcard "DOK CRM subdomains" blocks,
# so fmi.crmstack.site matches this dedicated stack instead of the shared CRM.
# Certificate: reuses the existing *.crmstack.site wildcard (live/crmstack.site).

# ── FMI CRM (dedicated stack) ────────────────────────────────────────────────
server {
    listen 80;
    server_name fmi.crmstack.site;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name fmi.crmstack.site;
    ssl_certificate     /etc/letsencrypt/live/crmstack.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmstack.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    client_max_body_size 50m;

    location ~ /\.env { deny all; return 404; }

    # crm-fmi-web serves the SPA, proxies /api to crm-fmi-backend and derives
    # X-Tenant-Subdomain ("fmi") from the Host header.
    location / {
        proxy_pass         http://crm-fmi-web:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
