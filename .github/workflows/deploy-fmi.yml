name: Deploy FMI

# Lives on the deploy/fmi branch only. Never copy this file to main.
on:
  push:
    branches: [deploy/fmi]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend typecheck and tests
        run: cd backend && npm ci && npx tsc --noEmit && npm test
      - name: Frontend build
        run: cd frontend && npm ci && npm run build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/deploy/fmi'
    runs-on: ubuntu-latest
    # GitHub settings: restrict this environment to branch "deploy/fmi", add a required reviewer,
    # and store SERVER_HOST / SERVER_USER / SERVER_SSH_KEY / SERVER_FINGERPRINT as environment secrets.
    environment: fmi-production
    concurrency:
      group: server-deploy # shared with deploy-main: one build at a time on the 1-CPU server
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/crm-fmi-stack/deploy/fmi
            bash deploy.sh
            sleep 20
            docker compose ps
            if docker compose ps --format '{{.Name}} {{.Status}}' | grep -Ei 'unhealthy|restarting|exited'; then
              echo "A container is not healthy after deploy"
              docker compose logs --tail=50 backend
              exit 1
            fi
